<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#grad)"/>
  <g fill="#fff">
    <!-- Text cursor icon -->
    <rect x="8" y="6" width="2" height="20" rx="1"/>
    <!-- Text lines -->
    <rect x="12" y="8" width="12" height="2" rx="1"/>
    <rect x="12" y="12" width="10" height="2" rx="1"/>
    <rect x="12" y="16" width="8" height="2" rx="1"/>
    <!-- Counter badge -->
    <circle cx="24" cy="24" r="6" fill="#fbbf24"/>
    <text x="24" y="27" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#1e293b" text-anchor="middle">#</text>
  </g>
</svg>
